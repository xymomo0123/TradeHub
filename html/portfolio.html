<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>持仓查看 - MOMO金融</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/guest.css">
    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/portfolio.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">MOMO金融</div>
        <div class="navbar-clock" id="real-time-clock"></div>
        <div class="navbar-actions">
            <a href="user.html" class="nav-btn">首页</a>
            <a href="portfolio.html" class="nav-btn active">持仓查看</a>
            <a href="profile.html" class="nav-btn">我的</a>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="main-content">
        <!-- 页面标题 -->
        <div class="page-header">
            <h1>我的持仓</h1>
            <div class="user-info">
                欢迎，<span id="username-display">用户</span>！ | 
                账户余额：<span id="balance-display">0.00</span> 元
            </div>
        </div>

        <!-- 刷新提示 -->
        <div class="refresh-notice">
            当前页面将在 <span id="refresh-countdown">5</span> 秒后刷新
        </div>

        <!-- 持仓统计 -->
        <div class="portfolio-summary">
            <div class="summary-card">
                <div class="summary-label">持仓总数</div>
                <div class="summary-value" id="total-positions">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">总成本</div>
                <div class="summary-value" id="total-cost">0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">总市值</div>
                <div class="summary-value" id="total-market-value">0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">总盈亏</div>
                <div class="summary-value" id="total-profit-loss">0.00</div>
            </div>
        </div>

        <!-- 持仓表格 -->
        <div class="portfolio-table-container">
            <div class="table-header">
                <h2>持仓明细</h2>
                <button id="refresh-btn" class="refresh-btn">手动刷新</button>
            </div>
            
            <div class="table-wrapper">
                <table id="portfolio-table">
                    <thead>
                        <tr>
                            <th>股票代码</th>
                            <th>股票名称</th>
                            <th>持仓数量</th>
                            <th>买入均价</th>
                            <th>最新价格</th>
                            <th>持仓成本</th>
                            <th>当前市值</th>
                            <th>盈亏金额</th>
                            <th>盈亏比例</th>
                        </tr>
                    </thead>
                    <tbody id="portfolio-table-body">
                        <!-- 动态填充 -->
                    </tbody>
                </table>
            </div>
            
            <!-- 空状态 -->
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">📊</div>
                <div class="empty-text">暂无持仓数据</div>
                <div class="empty-subtext">您还没有任何股票持仓</div>
                <a href="user.html" class="btn-primary">去交易</a>
            </div>
        </div>
    </main>

    <script src="../js/jquery-3.6.0.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/portfolio.js"></script>
</body>
</html>
