<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO金融 - 股票行情</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/guest.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">MOMO金融</div>
        <div class="navbar-clock" id="real-time-clock"></div>
        <div class="navbar-actions">
            <button id="login-btn">登录</button>
            <button id="register-btn">注册</button>
        </div>
    </nav>
    
    <!-- 主内容 -->
    <main class="main-content">
        <!-- 欢迎 -->
        <div class="welcome-section">
            <div class="welcome-title">欢迎来到 MOMO金融</div>
            <div class="welcome-subtitle">实时股票行情，专业投资分析</div>
        </div>

        <!-- 搜索区域 -->
        <div class="search-section">
            <div class="market-tabs">
                <button class="market-tab active" data-market="sh">沪市</button>
                <button class="market-tab" data-market="sz">深市</button>
                <button class="market-tab" data-market="cy">创业板</button>
            </div>
            <div class="stock-search">
                <input type="text" id="stock-search-input" placeholder="输入股票代码或名称">
                <button id="stock-search-btn">搜索</button>
            </div>
        </div>
        
        <!-- 刷新提示 -->
        <div class="refresh-notice">
            当前页面将在 <span id="refresh-countdown">5</span> 秒后刷新
        </div>
        
        <!-- 大盘表格 -->
        <div class="market-table-container">
            <table id="market-table">
                <thead>
                    <tr>
                        <th>代码</th>
                        <th>名称</th>
                        <th>最新价格</th>
                        <th>当日涨跌幅</th>
                        <th>当日涨跌额</th>
                        <th>详情</th>
                    </tr>
                </thead>
                <tbody id="market-table-body">
                    <!-- 动态填充 -->
                </tbody>
            </table>
        </div>
    </main>
    
    <!-- 股票详情模态框 -->
    <div id="stock-modal" class="modal hidden"></div>
    
    <script src="../js/jquery-3.6.0.min.js"></script>
    <script src="../js/chart.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/guest.js"></script>
</body>
</html>
